<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="violet" data-font="m">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Drift — your rooms</title>
  <meta name="description" content="Drift app — rooms, people and Zephyr AI.">
  <meta name="theme-color" content="#05060c">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/tokens.css?v=2.0.8">
  <link rel="stylesheet" href="./css/base.css?v=2.0.8">
  <link rel="stylesheet" href="./css/components.css?v=2.0.8">
  <link rel="stylesheet" href="./css/animations.css?v=2.0.8">
  <link rel="stylesheet" href="./css/app.css?v=2.0.8">
  <link rel="stylesheet" href="./css/responsive.css?v=2.0.8">
</head>
<body class="app-body">
  <div class="aurora"></div>

  <div class="shell">
    <!-- ============ Desktop rail ============ -->
    <aside class="rail">
      <a href="./index.html" aria-label="Drift home">
        <svg width="30" height="30" viewBox="0 0 48 48"><defs><linearGradient id="lgc" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#7C5CFF"/><stop offset="1" stop-color="#F472B6"/></linearGradient></defs><rect width="48" height="48" rx="12" fill="url(#lgc)"/><path d="M9 29c5-13 11-13 15-1 3 9 8 9 14-2" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>
      </a>
      <nav class="rail-nav" id="railNav" aria-label="Primary">
        <button class="rail-btn on" data-view="home" data-tip="Home"></button>
        <button class="rail-btn" data-view="discover" data-tip="Discover"></button>
        <button class="rail-btn" data-view="rooms" data-tip="Your rooms">
          <span class="count-pill" id="railRoomsBadge" style="display:none;"></span>
        </button>
        <button class="rail-btn" data-view="people" data-tip="People"></button>
        <span class="rail-sep"></span>
        <button class="rail-btn" id="bellBtn" data-tip="Notifications">
          <span class="count-pill" data-notif-badge style="display:none;"></span>
        </button>
        <button class="rail-btn" data-view="zephyr" data-tip="Zephyr AI ✨"></button>
      </nav>
      <div class="rail-spacer"></div>
      <button class="rail-btn" data-view="settings" data-tip="Settings"></button>
      <button class="rail-avatar-btn" id="railAvatarBtn" data-tip="You">
        <span id="railAvatar"></span>
      </button>
    </aside>

    <!-- ============ Mobile top bar ============ -->
    <header class="mobile-top">
      <svg width="26" height="26" viewBox="0 0 48 48"><defs><linearGradient id="lgd" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#7C5CFF"/><stop offset="1" stop-color="#F472B6"/></linearGradient></defs><rect width="48" height="48" rx="12" fill="url(#lgd)"/><path d="M9 29c5-13 11-13 15-1 3 9 8 9 14-2" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>
      <span class="logo-name" style="font-family:var(--font-d);font-weight:700;">Dri<b style="background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">ft</b></span>
      <span class="grow"></span>
      <button class="icon-btn" id="mobSearchBtn" aria-label="Search"></button>
      <button class="icon-btn" id="mobBell" aria-label="Notifications" style="position:relative;">
        <span class="count-pill" data-notif-badge style="display:none;top:2px;right:2px;"></span>
      </button>
      <button id="mobAvatarBtn" style="border-radius:50%;padding:1px;"><span id="mobAvatar"></span></button>
    </header>

    <!-- ============ Main view container ============ -->
    <main class="view" id="view" tabindex="-1"></main>

    <!-- ============ Mobile bottom nav ============ -->
    <nav class="bottomnav" aria-label="Mobile navigation">
      <div class="bottomnav-inner" id="bottomNav">
        <button class="bn-item on" data-view="home"></button>
        <button class="bn-item" data-view="discover"></button>
        <button class="bn-item" data-view="rooms">
          <span class="count-pill" id="bnRoomsBadge" style="display:none;"></span>
        </button>
        <button class="bn-item" data-view="people"></button>
        <button class="bn-item" data-view="zephyr"></button>
      </div>
    </nav>
  </div>

  <!-- Overlay roots (populated by js/ui.js & friends) -->
  <div id="modal-root" class="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <div id="tour-root"></div>
  <div id="game-root" class="game-stage"></div>

  <!-- Core modules -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js?v=2.0.8"></script>
  <script src="./js/supabase-client.js?v=2.0.8"></script>
  <script src="./js/utils.js?v=2.0.8"></script>
  <script src="./js/store.js?v=2.0.8"></script>
  <script src="./js/ui.js?v=2.0.8"></script>
  <script src="./js/backend.js?v=2.0.8"></script>
  <script src="./js/auth.js?v=2.0.8"></script>
  <script src="./js/email.js?v=2.0.8"></script>
  <script src="./js/notifications.js?v=2.0.8"></script>
  <script src="./js/ai.js?v=2.0.8"></script>
  <script src="./js/rooms.js?v=2.0.8"></script>
  <script src="./js/moderation.js?v=2.0.8"></script>
  <script src="./js/chat.js?v=2.0.8"></script>
  <script src="./js/activities.js?v=2.0.8"></script>
  <script src="./js/people.js?v=2.0.8"></script>
  <script src="./js/finder.js?v=2.0.8"></script>
  <script src="./js/settings.js?v=2.0.8"></script>

  <!-- App bootstrap (router + shell) must come last -->
  <script src="./js/app.js?v=2.0.8"></script>
</body>
</html>
